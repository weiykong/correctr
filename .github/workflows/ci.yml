name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build # tsc --noEmit && vite build

  rust:
    # macOS runner: the crate is macOS-targeted (AX/pasteboard modules) and
    # a Linux runner would need the webkit2gtk system libs to compile tauri.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - working-directory: src-tauri
        run: cargo clippy -- -D warnings
      - working-directory: src-tauri
        run: cargo test
